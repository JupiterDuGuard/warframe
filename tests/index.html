<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тесты движка</title>
<style>
body{font:14px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#f4f6f3;color:#17201c}
li{margin:4px 0}.ok{color:#2c7552}.fail{color:#9e2f3d}code{font-size:12px;color:#5a6961}
</style>
</head>
<body>
<h1>Тесты движка</h1>
<p id="sum">Запуск…</p>
<ul id="list"></ul>
<script type="module">
import { cases, makeContext, DATA_FILES } from './cases.mjs';
const load = p => fetch('../' + p).then(r => r.json());
async function loadTree(obj) {
  const out = {};
  for (const [k, v] of Object.entries(obj)) out[k] = typeof v === 'string' ? await load(v) : await loadTree(v);
  return out;
}
const ctx = makeContext(await loadTree(DATA_FILES));
let ok = 0;
for (const c of cases) {
  const li = document.createElement('li');
  try { c.run(ctx); li.className = 'ok'; li.textContent = '✓ ' + c.name; ok++; }
  catch (e) { li.className = 'fail'; li.innerHTML = '✗ ' + c.name + '<br><code>' + e.message + '</code>'; }
  document.getElementById('list').append(li);
}
document.getElementById('sum').textContent = `Пройдено ${ok} из ${cases.length}`;
window.__testResult = { ok, total: cases.length };
</script>
</body>
</html>
