<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тесты движка</title>
<link rel="stylesheet" href="../css/theme.css">
<style>
body{font:14px/1.5 var(--body);margin:0;padding:16px;color:var(--ink)}
h1{font:700 20px var(--display);letter-spacing:.08em;text-transform:uppercase}
li{margin:4px 0}.ok{color:var(--accent)}.fail{color:var(--red)}code{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<h1>Тесты движка</h1>
<p id="sum">Запуск…</p>
<ul id="list"></ul>
<script type="module">
import { cases, makeContext, DATA_FILES } from './cases.mjs';
const load = p => fetch('../' + p).then(r => r.json());
async function loadTree(obj) {
  const out = {};
  for (const [k, v] of Object.entries(obj)) out[k] = typeof v === 'string' ? await load(v) : await loadTree(v);
  return out;
}
const ctx = makeContext(await loadTree(DATA_FILES));
let ok = 0;
for (const c of cases) {
  const li = document.createElement('li');
  try { await c.run(ctx); li.className = 'ok'; li.textContent = '✓ ' + c.name; ok++; }
  catch (e) { li.className = 'fail'; li.innerHTML = '✗ ' + c.name + '<br><code>' + e.message + '</code>'; }
  document.getElementById('list').append(li);
}
document.getElementById('sum').textContent = `Пройдено ${ok} из ${cases.length}`;
window.__testResult = { ok, total: cases.length };
</script>
</body>
</html>
